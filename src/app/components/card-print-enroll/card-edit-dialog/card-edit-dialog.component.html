<div class="ced-dialog">

  <div class="ced-header">
    <div class="ced-header__icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
    </div>
    <div>
      <h3 class="ced-header__title">Edit Card Details</h3>
      <p class="ced-header__sub">{{ data.cardHolder }}</p>
    </div>
    <button class="ced-close" (click)="close()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="ced-body">

    <div class="ced-field">
      <label class="ced-label">Cardholder</label>
      <div class="ced-readonly">{{ data.cardHolder }}</div>
    </div>

    <div class="ced-field">
      <label class="ced-label">Card Details</label>
      <input class="ced-input" [(ngModel)]="data.cardDetails" placeholder="Enter card details" />
    </div>

    <div class="ced-field">
      <label class="ced-label">Card CSN</label>
      <div class="csn-row">
        <input class="ced-input ced-input--mono" [(ngModel)]="data.cardCSN" placeholder="Enter CardCSN" />
        <div class="csn-indicator" *ngIf="data.cardCSN">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Access Points -->
    <div class="ced-section">
      <div class="ced-section__header">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="16"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
        Card Access Points
        <span class="access-count">{{ data.accessPoints?.length || 0 }}</span>
      </div>

      <div class="access-table-wrap">
        <table class="access-table" *ngIf="data.accessPoints?.length; else noAccess">
          <thead>
            <tr>
              <th>ID</th>
              <th>Access Point</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let ap of data.accessPoints">
              <td><span class="ap-id">{{ ap.id }}</span></td>
              <td><span class="ap-name">{{ ap.accessPoint }}</span></td>
              <td>
                <button class="btn-block" (click)="blockAccessPoint(ap.id)">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
                  </svg>
                  Block
                </button>
              </td>
            </tr>
          </tbody>
        </table>

        <ng-template #noAccess>
          <div class="no-access">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3">
              <circle cx="12" cy="12" r="10"/>
              <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
            </svg>
            <p>No access points assigned</p>
          </div>
        </ng-template>
      </div>
    </div>

  </div>

  <div class="ced-footer">
    <button class="btn-cancel" (click)="close()">Cancel</button>
    <button class="btn-save" (click)="saveAndPrint()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
        <polyline points="17 21 17 13 7 13 7 21"/>
        <polyline points="7 3 7 8 15 8"/>
      </svg>
      Save and Print
    </button>
  </div>

</div>
